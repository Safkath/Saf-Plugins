<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Closed</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <div class="card">
      <div class="status-pill">
        <span class="dot"></span>
        <span>Offline</span>
      </div>
      <h1>Closed</h1>
      <p class="subtitle">Goodbye, have a good day.</p>
      <div class="divider"></div>
      <p class="contact-label">For any questions, DM</p>
      <button class="dm-button" id="copyBtn" type="button" aria-label="Copy username noolawq">
        <span id="handleText">noolawq</span>
        <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
    </div>
  </main>

  <script>
    const copyBtn = document.getElementById("copyBtn");
    const handleText = document.getElementById("handleText");

    copyBtn.addEventListener("click", () => {
      navigator.clipboard.writeText("noolawq");
      handleText.textContent = "Copied";
      copyBtn.classList.add("copied");
      setTimeout(() => {
        handleText.textContent = "noolawq";
        copyBtn.classList.remove("copied");
      }, 1800);
    });
  </script>
</body>
</html>
